services:
  - type: web
    name: pgh-bus-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PAAC_API_KEY
        sync: false  # You'll set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11"
